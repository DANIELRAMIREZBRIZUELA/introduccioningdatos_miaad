version: "3.8"

services:
  metabase_clase7:
    image: metabase/metabase:v0.55.7
    container_name: metabase_clase7
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SITE_NAME: "Clase7 Metabase"
      MB_ANON_TRACKING_ENABLED: "false"
      MB_EMOJI_IN_LOGS: "false"
    volumes:
      - ./data:/metabase-data
